name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube uses Git metadata to improve blame and new-code analysis.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install '.[dev]'
      - name: Lint
        run: ruff check services
      - name: Unit tests and coverage
        run: python -m pytest --cov-report=xml
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      - name: Check SonarQube configuration
        id: sonar-config
        if: ${{ vars.SONARQUBE_ENABLED == 'true' }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [[ -n "${SONAR_TOKEN:-}" && -n "${SONAR_HOST_URL:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube scan skipped: SONAR_TOKEN or SONAR_HOST_URL is not configured."
          fi
      - name: SonarQube scan
        if: ${{ vars.SONARQUBE_ENABLED == 'true' && steps.sonar-config.outputs.configured == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  containers:
    name: Build and scan ${{ matrix.service }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - airport_service
          - itinerary_service
          - notification_service
          - web_app
        variant: [local]
        include:
          - service: itinerary_service
            variant: aws
          - service: notification_service
            variant: lambda
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        env:
          SERVICE: ${{ matrix.service }}
          VARIANT: ${{ matrix.variant }}
        run: |
          context="services/$SERVICE"
          image="$SERVICE:ci-$VARIANT"
          case "$VARIANT" in
            aws)
              docker build --platform linux/amd64 --build-arg INCLUDE_RDS_CA=true -t "$image" "$context"
              ;;
            lambda)
              docker buildx build --load --platform linux/amd64 --provenance=false \
                -f "$context/Dockerfile.lambda" -t "$image" "$context"
              ;;
            local)
              docker build -t "$image" "$context"
              ;;
          esac
      - name: Scan critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ matrix.service }}:ci-${{ matrix.variant }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
  terraform:
    name: Validate Terraform (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [terraform, terraform/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform validate
