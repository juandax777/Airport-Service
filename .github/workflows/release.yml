name: Publish images to Amazon ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: web_app
            repository: web-app
          - service: airport_service
            repository: airport-service
          - service: itinerary_service
            repository: itinerary-service
          - service: notification_service
            repository: notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish image
        env:
          INCLUDE_RDS_CA: ${{ matrix.service == 'itinerary_service' }}
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_PREFIX }}/${{ matrix.repository }}:${{ github.sha }}"
          if [ "${{ matrix.service }}" = "notification_service" ]; then
            docker buildx build --load --platform linux/amd64 --provenance=false \
              -f services/notification_service/Dockerfile.lambda -t "$IMAGE" services/notification_service
          else
            docker build --platform linux/amd64 --build-arg INCLUDE_RDS_CA="$INCLUDE_RDS_CA" -t "$IMAGE" "services/${{ matrix.service }}"
          fi
          docker push "$IMAGE"
