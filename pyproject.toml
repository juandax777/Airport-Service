[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-itineraries"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "aio-pika>=9.5",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=6.0",
  "pytest-bdd>=7.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["services"]
pythonpath = [
  "services/airport_service",
  "services/itinerary_service",
  "services/notification_service",
]
addopts = "--import-mode=importlib --cov=services --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
