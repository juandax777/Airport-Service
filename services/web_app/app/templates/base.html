<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Planificador personal de itinerarios y aeropuertos colombianos">
  <title>{{ title }} · Vuela</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}?v=20261009-2">
  {% block head %}{% endblock %}
</head>
<body data-page="{% block page_id %}{% endblock %}" data-item-id="{{ item_id | default('') }}" data-mode="{{ mode | default('') }}">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Vuela, inicio"><span class="brand-mark" aria-hidden="true">✦</span><span>Vuela</span></a>
    <nav aria-label="Navegación principal">
      <a href="/" {% if active == 'dashboard' %}aria-current="page"{% endif %}>Aeropuertos</a>
      <a href="/itineraries" {% if active == 'itineraries' %}aria-current="page"{% endif %}>Itinerarios</a>
    </nav>
    <a class="button button-primary button-small" href="/itineraries/new">Nuevo viaje</a>
  </header>
  <main id="contenido" class="page-shell">{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', path='/js/app.js') }}?v=20261009-2" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
